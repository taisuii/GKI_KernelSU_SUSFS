name: Build Custom Version Kernel

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      ksu_commit:
        description: "KSU Commit (optional, leave empty for canary)"
        type: string
        default: ""
        required: false
      build_bypass:
        description: "Build Bypass (enable module check bypass)"
        type: boolean
        default: true
        required: false

jobs:
  build-custom-kernel:
    name: "6.1.145-android14-11-Custom"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
    - name: Build Summary
      run: |
        echo "========================================"
        echo "   Custom Version Kernel Build"
        echo "========================================"
        echo "Android Version : android14"
        echo "Kernel Version  : 6.1"
        echo "Sub Level       : 145"
        echo "Patch Level     : 2025-09"
        echo "KSU Commit      : ${{ inputs.ksu_commit || 'canary' }}"
        echo "Build Bypass    : ${{ inputs.build_bypass }}"
        echo "========================================"

    - name: Free Disk Space
      if: true
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"
        testing: false

    - name: Setup Build Environment
      run: |
        CONFIG="android14-6.1-145"
        KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
        mkdir -p "$KERNEL_ROOT"

        cat >> $GITHUB_ENV << EOF
        DEFCONFIG=$KERNEL_ROOT/common/arch/arm64/configs/gki_defconfig
        DEFCONFIG_FRAGMENT=$KERNEL_ROOT/common/arch/arm64/configs/wild_gki.fragment
        CONFIG=$CONFIG
        KERNEL_ROOT=$KERNEL_ROOT
        SUSFS4KSU=$GITHUB_WORKSPACE/susfs4ksu
        KERNEL_PATCHES=$GITHUB_WORKSPACE/kernel_patches
        ANYKERNEL3=$GITHUB_WORKSPACE/AnyKernel3
        REPO=$GITHUB_WORKSPACE/git-repo/repo
        EOF
        
        mkdir -p "$GITHUB_WORKSPACE/git-repo"
        curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
        chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
        echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"

    - name: Clone AnyKernel3 and Other Dependencies
      run: |
        ANYKERNEL_BRANCH="gki-2.0"
        git clone https://github.com/WildKernels/AnyKernel3.git -b "$ANYKERNEL_BRANCH"
        rm -rf AnyKernel3/.git
        git clone https://github.com/WildKernels/kernel_patches.git

    - name: Initialize and Sync Kernel Source
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        FORMATTED_BRANCH="android14-6.1-2025-09"
        repo init -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16 --depth=1

        REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
        DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml
        if grep -q deprecated <<< $REMOTE_BRANCH; then
          sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
        fi

        repo --trace sync -c -j$(nproc --all) --fail-fast --no-tags --force-sync --no-clone-bundle

    - name: Extract Sublevel and Set File Name
      run: |
        ACTUAL_SUBLEVEL="145"
        if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
          EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
          [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
        fi

        ARTIFACT_BASE="6.1.$ACTUAL_SUBLEVEL-android14-2025-09-Custom"
        echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
        echo "ARTIFACT_BASE=$ARTIFACT_BASE" >> $GITHUB_ENV
        echo "FILE_NAME=$ARTIFACT_BASE" >> $GITHUB_ENV

    - name: Add WKSU
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        if [[ -n "${{ inputs.ksu_commit }}" ]]; then
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s "${{ inputs.ksu_commit }}"
        else
          curl -LSs "https://raw.githubusercontent.com/WildKernels/Wild_KSU/wild/kernel/setup.sh" | bash -s canary
        fi

    - name: Clone & Apply SUSFS Patches
      run: |
        SUSFS_BRANCH="gki-android14-6.1"
        git clone https://gitlab.com/simonpunk/susfs4ksu.git -b "$SUSFS_BRANCH"

        SUSFS_VERSION="2.0.0"
        cd "$KERNEL_ROOT/Wild_KSU"
        echo "Nothing to fix for WKSU"

        cd "$KERNEL_ROOT/common"
        cp "$SUSFS4KSU/kernel_patches/fs/"* "$KERNEL_ROOT/common/fs/"
        cp "$SUSFS4KSU/kernel_patches/include/linux/"* "$KERNEL_ROOT/common/include/linux/"
        cp $SUSFS4KSU/kernel_patches/50_add_susfs_in_gki-android14-6.1.patch ./
        patch -p1 < 50_add_susfs_in_gki-android14-6.1.patch || true

        if [[ "$ACTUAL_SUBLEVEL" -ge 145 ]]; then
          cp $KERNEL_PATCHES/wild/susfs_fix_patches/v${SUSFS_VERSION}/a14-6.1/base.c.patch ./
          patch -p1 < base.c.patch
        fi

    - name: Add BBG
      if: true
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        curl -LSs https://github.com/vc-teahouse/Baseband-guard/raw/main/setup.sh | bash
        echo "CONFIG_BBG=y" >> "${{ env.DEFCONFIG_FRAGMENT }}"
        sed -i '/^config LSM$/,/^help$/{ /^[[:space:]]*default/ { /baseband_guard/! s/selinux/selinux,baseband_guard/ } }' common/security/Kconfig

    - name: Apply Module Check Bypass
      if: ${{ inputs.build_bypass }}
      run: |
        TARGET_FILE="$KERNEL_ROOT/common/kernel/module/version.c"

        echo "Applying bypass to $TARGET_FILE"
        sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$TARGET_FILE"

        # Verify the bypass
        if grep -A 5 "bad_version:" "$TARGET_FILE" | grep -q "return 1;"; then
          echo "SUCCESS: Module check bypass verified in $TARGET_FILE"
        else
          echo "FAILED: Module check bypass not found in $TARGET_FILE"
          grep -A 5 "bad_version:" "$TARGET_FILE" || true
          exit 1
        fi

    - name: Configure Kernel Options
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        cat >> "${{ env.DEFCONFIG_FRAGMENT }}" << 'EOF'
        # KernelSU Configuration
        CONFIG_KSU=y
        CONFIG_KSU_SUSFS=y

        # KPatch Next Support
        CONFIG_KALLSYMS=y
        CONFIG_KALLSYMS_ALL=y

        # Mountify Support
        CONFIG_TMPFS_XATTR=y
        CONFIG_TMPFS_POSIX_ACL=y
        EOF

    - name: Change Kernel Name - Custom Version Format
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        # Get git commit hash from kernel source
        cd "$KERNEL_ROOT/common"
        KERNEL_COMMIT=$(git rev-parse --short=12 HEAD 2>/dev/null || echo "")
        if [ -n "$KERNEL_COMMIT" ]; then
          KERNEL_COMMIT_SHORT="gc${KERNEL_COMMIT}"
        else
          KERNEL_COMMIT_SHORT="gc00000000000"
        fi
        
        # Get additional identifier from workflow run ID
        if [ -n "$GITHUB_RUN_ID" ]; then
          ADDITIONAL_ID="ab${GITHUB_RUN_ID}"
        else
          ADDITIONAL_ID="ab$(date +%s | tail -c 10)"
        fi
        
        # Custom kernel version format: 6.1.145-android14-11-gc1de4747ac59-ab14219743
        # For 6.1 kernel, modify setlocalversion to add custom suffix
        if [ -n "$KERNEL_COMMIT_SHORT" ] && [ -n "$ADDITIONAL_ID" ]; then
          perl -i -0777 -pe "s/(.*)echo \"\\\$res\"/\$1echo \"\\\$res-${KERNEL_COMMIT_SHORT}-${ADDITIONAL_ID}\"/s" ./scripts/setlocalversion
        fi
        
        export KBUILD_BUILD_TIMESTAMP="$(date -u '+%a %b %e %H:%M:%S UTC %Y')"
        
        # Return to KERNEL_ROOT for build.sh check
        cd "$KERNEL_ROOT"
        if [ -f "build/build.sh" ]; then
          #Remove Dirty Flag
          sed -i 's/-dirty//' ./common/scripts/setlocalversion
        else
          #Remove Dirty Flag
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          sed -i 's/-dirty//' ./common/scripts/setlocalversion
          #Remove Abi Exports and Error
          rm -rf ./common/android/abi_gki_protected_exports_*
          perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' ./common/BUILD.bazel
        fi

        cd "$KERNEL_ROOT/common"
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Custom: Set version string" || true

    - name: Build Kernel
      working-directory: ${{ env.KERNEL_ROOT }}
      run: |
        set -ex
        make -C common mrproper
        if [ -f "build/build.sh" ]; then
          GKI_DEFCONFIG_FRAGMENT="${{ env.DEFCONFIG_FRAGMENT }}" LTO=thin BUILD_CONFIG=common/build.config.gki.aarch64 build/build.sh || exit 1
        else
          tools/bazel build --config=fast --lto=thin --defconfig_fragment=//common:arch/arm64/configs/wild_gki.fragment //common:kernel_aarch64_dist || exit 1
        fi

    - name: Prepare AnyKernel3 Zip
      run: |
        # Copy Image from normal build locations
        if [ -f "$KERNEL_ROOT/out/android14-6.1/dist/Image" ]; then
          cp "$KERNEL_ROOT/out/android14-6.1/dist/Image" "$ANYKERNEL3/Image"
        elif [ -f "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" ]; then
          cp "$KERNEL_ROOT/bazel-bin/common/kernel_aarch64/Image" "$ANYKERNEL3/Image"
        else
          echo "Error: Image file not found in any expected location"
          exit 1
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ env.FILE_NAME }}-AnyKernel3
        path: ./AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9
